version: '3.8'

services:
  whatsapp_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnichannel-whatsapp-service:latest
    container_name: whatsapp_microservice
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BACKEND_API_URL=${BACKEND_API_URL:-http://host.docker.internal:8000}
      - WHATSAPP_SERVICE_SECRET=${WHATSAPP_SERVICE_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
      - whatsapp_auth_data:/app/auth_info_baileys
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  whatsapp_auth_data:
